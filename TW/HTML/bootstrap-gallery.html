<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galerie Bootstrap</title>
    <!-- Includem Bootstrap direct prin CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <div class="container mt-5">
        <h2 class="mb-4 text-center">Pasul 6: Galerie cu Bootstrap 5</h2>
        
        <!-- row g-3 = un rând cu spațiere (gap) de 3 unități între elemente -->
        <div class="row g-3">
            
            <!-- col-12 pe mobil (ocupă tot rândul), col-md-6 pe tabletă+ (încap 2 pe rând) -->
            <div class="col-12 col-md-6">
                <div class="card p-4 shadow-sm bg-primary text-white text-center fw-bold">Card 1</div>
            </div>
            <div class="col-12 col-md-6">
                <div class="card p-4 shadow-sm bg-primary text-white text-center fw-bold">Card 2</div>
            </div>
            <div class="col-12 col-md-6">
                <div class="card p-4 shadow-sm bg-primary text-white text-center fw-bold">Card 3</div>
            </div>
            <div class="col-12 col-md-6">
                <div class="card p-4 shadow-sm bg-primary text-white text-center fw-bold">Card 4</div>
            </div>
            <div class="col-12 col-md-6">
                <div class="card p-4 shadow-sm bg-primary text-white text-center fw-bold">Card 5</div>
            </div>
            <div class="col-12 col-md-6">
                <div class="card p-4 shadow-sm bg-primary text-white text-center fw-bold">Card 6</div>
            </div>

        </div>
    </div>

</body>
</html>
